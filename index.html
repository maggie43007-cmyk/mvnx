<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#0D0E17;
    --surface:#161927;
    --surface-alt:#1E2235;
    --border:#2B3049;
    --text:#EDEFF7;
    --text-dim:#8B90AC;
    --text-faint:#5C6183;
    --violet:#8B5CF6;
    --violet-dim:#6D46D1;
    --gold:#F5B700;
    --cyan:#38BDF8;
    --green:#33C481;
    --coral:#FF6B6B;
    --danger:#F0455B;
    --radius-card:20px;
    --radius-sm:10px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(circle at 15% 0%, #191D33 0%, var(--bg) 45%), var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{
    font-family:'Space Grotesk',sans-serif;
    margin:0;
    letter-spacing:-0.01em;
  }
  p{margin:0;}
  button{
    font-family:'Inter',sans-serif;
    cursor:pointer;
    border:none;
    outline:none;
  }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:2px solid var(--cyan);
    outline-offset:2px;
  }
  input, textarea, select{
    font-family:'Inter',sans-serif;
    background:var(--surface-alt);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:var(--radius-sm);
    padding:11px 13px;
    font-size:14.5px;
    width:100%;
  }
  input::placeholder, textarea::placeholder{color:var(--text-faint);}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

  .wrap{max-width:980px;margin:0 auto;padding:0 20px 80px;}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 20px;max-width:980px;margin:0 auto;
  }
  .brand{display:flex;align-items:center;gap:11px;}
  .brand-mark{
    width:40px;height:40px;border-radius:10px;
    flex-shrink:0;object-fit:cover;
  }
  .hero-logo{width:96px;height:96px;border-radius:20px;margin:0 auto 18px;display:block;}
  .brand-text h1{font-size:19px;font-weight:700;}
  .brand-text span{font-size:11.5px;color:var(--text-dim);}
  .topbar-actions{display:flex;align-items:center;gap:10px;}
  .who-chip{
    display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--border);
    padding:6px 12px 6px 6px;border-radius:100px;font-size:13px;color:var(--text-dim);
  }
  .who-chip img{width:24px;height:24px;border-radius:50%;object-fit:cover;background:var(--surface-alt);}
  .btn{
    padding:10px 18px;border-radius:100px;font-size:14px;font-weight:600;
    transition:transform .12s ease, background .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--violet);color:#fff;}
  .btn-primary:hover{background:var(--violet-dim);}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-dim);}
  .btn-ghost:hover{border-color:var(--text-dim);color:var(--text);}
  .btn-danger{background:rgba(240,69,91,0.14);color:var(--danger);}
  .btn-danger:hover{background:rgba(240,69,91,0.25);}
  .btn-sm{padding:7px 13px;font-size:12.5px;}
  .btn-block{width:100%;}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}

  /* ---------- Landing ---------- */
  .hero{
    text-align:center;padding:50px 20px 30px;max-width:640px;margin:0 auto;
  }
  .hero h2{
    font-size:clamp(30px,5vw,42px);font-weight:700;line-height:1.08;
  }
  .hero h2 em{font-style:normal;color:var(--gold);}
  .hero p{margin-top:14px;color:var(--text-dim);font-size:15.5px;}

  .entry-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:16px;
    max-width:640px;margin:34px auto 0;padding:0 20px;
  }
  @media (max-width:600px){.entry-grid{grid-template-columns:1fr;}}
  .entry-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);
    padding:26px 22px;text-align:left;transition:border-color .15s ease, transform .15s ease;
  }
  .entry-card:hover{border-color:var(--violet-dim);transform:translateY(-2px);}
  .entry-card .icon{font-size:26px;}
  .entry-card h3{margin-top:12px;font-size:17px;}
  .entry-card p{color:var(--text-dim);font-size:13.5px;margin-top:6px;margin-bottom:18px;}

  .panel{
    max-width:420px;margin:26px auto 0;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--radius-card);padding:26px;
  }
  .panel h3{font-size:17px;margin-bottom:4px;}
  .panel .sub{color:var(--text-dim);font-size:13px;margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-weight:500;}
  .form-error{color:var(--danger);font-size:13px;margin-top:10px;}
  .form-note{color:var(--text-faint);font-size:12.5px;margin-top:10px;}
  .back-link{
    display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);
    font-size:13px;margin-bottom:18px;background:none;
  }
  .back-link:hover{color:var(--text);}

  .roster{max-width:420px;margin:20px auto 0;}
  .roster-item{
    display:flex;align-items:center;gap:12px;padding:11px 14px;
    background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:8px;
    transition:border-color .12s ease;
  }
  .roster-item:hover{border-color:var(--violet-dim);}
  .roster-item img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--surface-alt);}
  .roster-item .name{font-weight:600;font-size:14px;}
  .roster-item .pts{margin-left:auto;color:var(--gold);font-size:13px;font-weight:600;}

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);
    border-radius:100px;padding:5px;margin:0 auto 30px;max-width:fit-content;
    overflow-x:auto;
  }
  .tab-btn{
    padding:9px 17px;border-radius:100px;font-size:13.5px;font-weight:600;
    color:var(--text-dim);background:transparent;white-space:nowrap;
  }
  .tab-btn.active{background:var(--violet);color:#fff;}

  /* ---------- Player Card ---------- */
  .player-card{
    position:relative;border-radius:26px;padding:2px;margin-bottom:26px;
    background:linear-gradient(135deg, var(--border), var(--border));
  }
  .player-card.tier-npc{background:linear-gradient(135deg,#2B3049,#2B3049);}
  .player-card.tier-trainee{background:linear-gradient(135deg,#2E6E63,#38BDF8);}
  .player-card.tier-skilled{background:linear-gradient(135deg,#2E6ECB,#38BDF8);}
  .player-card.tier-pro{background:linear-gradient(135deg,#5B4FCF,#8B5CF6);}
  .player-card.tier-elite{background:linear-gradient(135deg,#8B5CF6,#C084FC);}
  .player-card.tier-champion{background:linear-gradient(135deg,#B8860B,#F5B700);}
  .player-card.tier-legend{background:linear-gradient(135deg,#F5B700,#FF6B6B);}
  .player-card.tier-untouchable{background:linear-gradient(120deg,#8B5CF6,#38BDF8,#F5B700,#FF6B6B,#8B5CF6);background-size:300% 300%;animation:holo 6s ease infinite;}
  @keyframes holo{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

  .player-card-inner{
    background:var(--surface);border-radius:24px;padding:28px;
    display:flex;gap:22px;align-items:center;flex-wrap:wrap;
  }
  .avatar-wrap{position:relative;flex-shrink:0;}
  .avatar-wrap img{
    width:96px;height:96px;border-radius:50%;object-fit:cover;background:var(--surface-alt);
    border:3px solid var(--surface);
  }
  .avatar-edit{
    position:absolute;bottom:-2px;right:-2px;width:30px;height:30px;border-radius:50%;
    background:var(--violet);display:flex;align-items:center;justify-content:center;
    font-size:13px;border:2px solid var(--surface);overflow:hidden;
  }
  .avatar-edit:hover{background:var(--violet-dim);}
  .pc-main{flex:1;min-width:200px;}
  .pc-name{font-size:22px;font-weight:700;}
  .pc-rank{
    display:inline-flex;align-items:center;gap:6px;margin-top:6px;
    font-size:13px;font-weight:600;color:var(--gold);
    background:rgba(245,183,0,0.12);padding:5px 12px;border-radius:100px;
  }
  .pc-points{margin-top:14px;font-size:13px;color:var(--text-dim);}
  .pc-points b{color:var(--text);font-size:19px;font-family:'Space Grotesk';}
  .pc-progress{margin-top:8px;height:6px;background:var(--surface-alt);border-radius:6px;overflow:hidden;max-width:280px;}
  .pc-progress-fill{height:100%;background:linear-gradient(90deg,var(--violet),var(--gold));}
  .pc-progress-label{font-size:11.5px;color:var(--text-faint);margin-top:5px;}
  .pc-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;width:100%;}
  .badge{
    display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:12px;
    background:var(--surface-alt);border:1px solid var(--border);font-size:12.5px;
  }
  .badge .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .badge.unranked{opacity:0.4;}
  .badge b{font-weight:700;color:var(--text);}
  .pc-share{margin-top:18px;}
  .featured-block{margin-top:18px;padding-top:16px;border-top:1px solid var(--border);width:100%;}
  .featured-block .ft-label{font-size:12px;color:var(--gold);margin-bottom:8px;font-weight:700;}
  .featured-row{display:flex;gap:12px;align-items:center;}
  .featured-row img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--surface-alt);}

  /* ---------- Cards / lists ---------- */
  .section-title{font-size:15px;font-weight:700;margin-bottom:14px;color:var(--text-dim);}
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:14px;
  }
  .empty-state{
    text-align:center;padding:50px 20px;color:var(--text-dim);
    background:var(--surface);border:1px dashed var(--border);border-radius:16px;
  }
  .empty-state .icon{font-size:28px;margin-bottom:10px;}

  .sub-row{display:flex;gap:14px;align-items:flex-start;}
  .sub-thumb-wrap{position:relative;flex-shrink:0;width:64px;height:64px;}
  .sub-thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--surface-alt);flex-shrink:0;display:block;}
  .sub-thumb.placeholder{display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--text-faint);}
  .sub-thumb-count{position:absolute;bottom:2px;right:2px;background:rgba(0,0,0,0.75);color:#fff;font-size:10px;padding:1px 5px;border-radius:6px;font-weight:600;}
  .sub-info{flex:1;min-width:0;}
  .sub-title-row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .sub-title{font-weight:600;font-size:14.5px;}
  .sub-meta{font-size:12px;color:var(--text-faint);margin-top:3px;}
  .sub-desc{font-size:13px;color:var(--text-dim);margin-top:6px;}
  .pill{
    font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px;white-space:nowrap;
  }
  .pill-pending{background:rgba(245,183,0,0.15);color:var(--gold);}
  .pill-approved{background:rgba(51,196,129,0.15);color:var(--green);}
  .pill-rejected{background:rgba(240,69,91,0.15);color:var(--danger);}
  .sub-note{font-size:12.5px;color:var(--text-faint);margin-top:6px;font-style:italic;}
  .pinned-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--gold);font-weight:700;margin-top:6px;}

  .lb-row{
    display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:14px;margin-bottom:8px;
    background:var(--surface);border:1px solid var(--border);
  }
  .lb-row.me{border-color:var(--violet);background:rgba(139,92,246,0.08);}
  .lb-rank{width:26px;text-align:center;font-weight:700;color:var(--text-dim);font-family:'Space Grotesk';}
  .lb-rank.top1{color:var(--gold);}
  .lb-rank.top2{color:#C9CEDD;}
  .lb-rank.top3{color:#D9995B;}
  .lb-row img{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--surface-alt);}
  .lb-name{font-weight:600;font-size:14px;}
  .lb-tag{font-size:11.5px;color:var(--gold);}
  .lb-pts{margin-left:auto;font-family:'Space Grotesk';font-weight:700;font-size:15px;}
  .lb-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;}
  .lb-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:100px;background:var(--surface-alt);border:1px solid var(--border);color:var(--text-dim);white-space:nowrap;}
  .lb-search{margin-bottom:16px;}

  /* ---------- Forms ---------- */
  .form-grid{display:grid;gap:14px;}
  .cat-select{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  @media (max-width:560px){.cat-select{grid-template-columns:repeat(2,1fr);}}
  .cat-option{
    border:1.5px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center;
    background:var(--surface-alt);font-size:12.5px;font-weight:600;color:var(--text-dim);
  }
  .cat-option .icon{font-size:19px;display:block;margin-bottom:5px;}
  .cat-option.active{border-color:var(--violet);color:var(--text);background:rgba(139,92,246,0.1);}
  .upload-box{
    border:1.5px dashed var(--border);border-radius:14px;padding:22px;text-align:center;
    color:var(--text-dim);font-size:13px;background:var(--surface-alt);position:relative;
  }
  .upload-box input[type=file]{
    position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;
  }
  .thumb-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .thumb-item{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;background:var(--surface-alt);}
  .thumb-item img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb-remove{
    position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;
    background:rgba(6,7,13,0.75);color:#fff;font-size:12px;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }

  .filter-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .filter-chip{
    padding:8px 15px;border-radius:100px;font-size:13px;font-weight:600;
    background:var(--surface);border:1px solid var(--border);color:var(--text-dim);
  }
  .filter-chip.active{background:var(--violet);color:#fff;border-color:var(--violet);}

  .admin-review-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center;}
  .points-input{width:80px;padding:8px 10px;font-size:13px;}
  .user-row{
    display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--surface);
    border:1px solid var(--border);border-radius:14px;margin-bottom:8px;flex-wrap:wrap;
  }
  .user-row img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--surface-alt);}
  .user-row .um{flex:1;min-width:0;}
  .user-row .um .n{font-weight:600;font-size:14px;}
  .user-row .um .e{font-size:12px;color:var(--text-faint);}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(6,7,13,0.75);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:100;
  }
  .modal-box{
    background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px;
    max-width:440px;width:100%;
  }
  .modal-box img{width:100%;border-radius:12px;margin-bottom:6px;max-height:60vh;object-fit:contain;background:var(--surface-alt);}
  .modal-box textarea{min-height:90px;resize:vertical;}
  .gallery-nav{display:flex;align-items:center;justify-content:space-between;margin:10px 0;}
  .gallery-nav button{
    background:var(--surface-alt);border:1px solid var(--border);color:var(--text);
    width:36px;height:36px;border-radius:50%;font-size:17px;
  }
  .gallery-nav span{font-size:12.5px;color:var(--text-dim);}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--surface-alt);border:1px solid var(--border);color:var(--text);
    padding:12px 20px;border-radius:100px;font-size:13.5px;box-shadow:0 8px 30px rgba(0,0,0,0.4);
    z-index:200;opacity:0;transition:opacity .25s ease, transform .25s ease;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  .loading-screen{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:60vh;color:var(--text-dim);gap:10px;font-size:14px;
  }
  .spinner{
    width:26px;height:26px;border-radius:50%;border:3px solid var(--border);
    border-top-color:var(--violet);animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .footer-note{text-align:center;color:var(--text-faint);font-size:12px;margin-top:40px;}
</style>

  // ---------------- App state (in-memory) ----------------
  var appState = { users: [] };     // synced with shared storage
  var stateLoaded = false;
  var session = { role: null, userId: null }; // role: 'player' | 'admin' | null
  var screen = "landing";           // landing | join | admin-login | player | admin
  var playerTab = "card";
  var adminTab = "queue";
  var adminFilter = "pending";
  var modal = null;                 // { type, data }
  var authMode = "signin";          // signin | signup
  var authError = "";
  var adminLoginError = "";

  var submitError = "";
  var leaderboardSearch = "";

  var root = document.getElementById("app-root");

  // ---------------- Storage helpers ----------------
  function loadState(){
    return window.storage.get(STORAGE_KEY, true).then(function(res){
      var value = res && res.value ? JSON.parse(res.value) : { users: [] };
      appState = value;
      stateLoaded = true;
      if (cleanupExpiredRejections()){
        return saveState().then(function(){ return appState; });
      }
      return appState;
    }).catch(function(){
      appState = { users: [] };
      stateLoaded = true;
      return appState;
    });
  }

  function saveState(){
    return window.storage.set(STORAGE_KEY, JSON.stringify(appState), true).catch(function(err){
      showToast("Could not save — check your connection and try again.");
      console.error("MVNX storage error:", err);
    });
  }

  // Rejected submissions quietly disappear from history 5 days after being rejected,
  // so a bad photo doesn't sit around clogging up the list forever.
  function cleanupExpiredRejections(){
    var changed = false;
    var cutoff = Date.now() - REJECTED_EXPIRY_MS;
    appState.users.forEach(function(u){
      var before = (u.submissions || []).length;
      u.submissions = (u.submissions || []).filter(function(s){
        if (s.status === "rejected"){
          var ts = new Date(s.reviewedDate || s.date).getTime();
          if (!isNaN(ts) && ts <= cutoff) return false;
        }
        return true;
      });
      if (u.submissions.length !== before) changed = true;
      if (u.pinnedId && !u.submissions.some(function(s){ return s.id === u.pinnedId; })) u.pinnedId = null;
    });
    return changed;
  }

  // ---------------- Utilities ----------------
  function genId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function fmtDate(iso){
    var d = new Date(iso);
    return d.toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" });
  }
  function subImages(s){
    if (!s) return [];
    if (s.images && s.images.length) return s.images;
    if (s.image) return [s.image];
    return [];
  }

  // Hash a password with the user's id as salt. Uses Web Crypto when available,
  // falling back to a simple non-cryptographic hash so sign-in still works
  // in environments without SubtleCrypto.
  function hashPassword(password, salt){
    var input = salt + ":" + password;
    if (window.crypto && window.crypto.subtle && window.crypto.subtle.digest){
      return window.crypto.subtle.digest("SHA-256", new TextEncoder().encode(input)).then(function(buf){
        return Array.prototype.map.call(new Uint8Array(buf), function(b){
          return ("0"+b.toString(16)).slice(-2);
        }).join("");
      });
    }
    var hash = 0;
    for (var i=0;i<input.length;i++){
      hash = ((hash << 5) - hash + input.charCodeAt(i)) | 0;
    }
    return Promise.resolve("fb" + (hash >>> 0).toString(16));
  }

  function resizeImage(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var w = img.width, h = img.height;
          if (w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
          else if (h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
          var canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = function(){ reject(new Error("Could not read image")); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ reject(new Error("Could not read file")); };
      reader.readAsDataURL(file);
    });
  }

  var toastTimer = null;
  function showToast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2600);
  }

  // ---------------- Derived data ----------------
  function getUser(id){
    for (var i=0;i<appState.users.length;i++) if (appState.users[i].id === id) return appState.users[i];
    return null;
  }
  function findUserByNameLower(nameLower){
    for (var i=0;i<appState.users.length;i++) if (appState.users[i].nameLower === nameLower) return appState.users[i];
    return null;
  }
  function findSubmission(subId, userId){
    var u = getUser(userId);
    if (!u) return null;
    var list = u.submissions || [];
    for (var i=0;i<list.length;i++) if (list[i].id === subId) return list[i];
    return null;
  }
  function userTotals(user){
    var earned = 0;
    var counts = { academic:0, sports:0, gaming:0, other:0 };
    (user.submissions||[]).forEach(function(s){
      if (s.status === "approved"){
        earned += (s.points||0);
        if (counts[s.category] !== undefined) counts[s.category]++;
      }
    });
    var spent = (user.purchases||[]).reduce(function(sum, p){ return sum + (p.cost||0); }, 0);
    var balance = earned - spent;
    // "points" is the live, spendable total (drives rank + leaderboard); "earned" is lifetime points before shop spending.
    return { points: balance, earned: earned, spent: spent, counts: counts };
  }
  function tierForCount(count){
    var tier = 0;
    TIER_THRESHOLDS.forEach(function(t, i){ if (count >= t) tier = i+1; });
    return tier;
  }
  function rankForPoints(points){
    var r = RANK_LADDER[0];
    RANK_LADDER.forEach(function(t){ if (points >= t.min) r = t; });
    return r.name;
  }
  function rankSlug(name){ return name.toLowerCase().replace(/\s+/g,"-").replace("default-npc","npc"); }
  function nextRankInfo(points){
    for (var i=0;i<RANK_LADDER.length;i++){
      if (points < RANK_LADDER[i].min){
        var prevMin = i>0 ? RANK_LADDER[i-1].min : 0;
        var span = RANK_LADDER[i].min - prevMin;
        var progressed = points - prevMin;
        return { next: RANK_LADDER[i].name, pct: Math.max(4, Math.round(progressed/span*100)), pointsToGo: RANK_LADDER[i].min - points };
      }
    }
    return { next: null, pct: 100, pointsToGo: 0 };
  }

  // ---------------- Render root ----------------
  function render(){
    if (!stateLoaded){
      root.innerHTML = renderTopbar() + '<div>App Loaded</div>';
      return;
    }
    var html = "";
    html += renderTopbar();
    if (screen === "landing") html += renderLanding();
    else if (screen === "join") html += renderJoin();
    else if (screen === "admin-login") html += renderAdminLogin();
    else if (screen === "player") html += renderPlayer();
    else if (screen === "admin") html += renderAdmin();
    html += '<p class="footer-note">MVNX — MVNeXpose · proof it, log it, flex it.</p>';
    root.innerHTML = html;
    attachHandlers(root);

    // clean up any stale modal overlays, then render the current one if any
    document.querySelectorAll(".modal-overlay").forEach(function(el){ el.remove(); });
    if (modal) renderModalInto();
  }

    return '<div class="loading-screen"><div class="spinner"></div><p>Loading MVNX…</p></div>';

  // ---------------- Player dashboard ----------------
  function renderPlayer(){
    var u = getUser(session.userId);
    if (!u){ screen = "landing"; session = {role:null,userId:null}; return renderLanding(); }
    var tabs = [
      {id:"card", label:"Player card"},
      {id:"submit", label:"Submit achievement"},
      {id:"history", label:"My submissions"},
      {id:"shop", label:"Shop"},
      {id:"leaderboard", label:"Leaderboard"}
    ];
    var tabsHtml = tabs.map(function(t){
      return '<button class="tab-btn '+(playerTab===t.id?'active':'')+'" data-action="player-tab" data-tab="'+t.id+'">'+t.label+'</button>';
    }).join("");

    var body = "";
    if (playerTab === "card") body = renderPlayerCard(u, true);
    else if (playerTab === "submit") body = renderSubmitForm();
    else if (playerTab === "history") body = renderHistory(u);
    else if (playerTab === "shop") body = renderShop(u);
    else if (playerTab === "leaderboard") body = renderLeaderboard(u.id);

    return '<div class="wrap"><div class="tabs">'+tabsHtml+'</div>'+body+'</div>';
  }

  function renderPlayerCard(u, editable){
    var totals = userTotals(u);
    var rank = rankForPoints(totals.points);
    var slug = rankSlug(rank);
    var nxt = nextRankInfo(totals.points);
    var badges = CATEGORY_ORDER.map(function(cat){
      var meta = CATEGORY_META[cat];
      var count = totals.counts[cat];
      var tier = tierForCount(count);
      var label = tier > 0 ? meta.role+" "+tier : "Unranked";
      return '<div class="badge '+(tier===0?'unranked':'')+'"><span class="dot" style="background:'+meta.color+'"></span>'+
        meta.icon+' '+meta.label+': <b>'+label+'</b></div>';
    }).join("");

    var pinnedSub = u.pinnedId ? findSubmission(u.pinnedId, u.id) : null;
    if (pinnedSub && pinnedSub.status !== "approved") pinnedSub = null;
    var featuredHtml = "";
    if (pinnedSub){
      var meta = CATEGORY_META[pinnedSub.category];
      var imgs = subImages(pinnedSub);
      featuredHtml = '<div class="featured-block"><div class="ft-label">\u2605 Featured achievement</div><div class="featured-row">'+
        (imgs.length ? '<img src="'+imgs[0]+'" alt="">' : '')+
        '<div><div style="font-weight:700;font-size:14px">'+escapeHtml(pinnedSub.title)+'</div>'+
        '<div style="font-size:12px;color:var(--text-dim)">'+meta.icon+' '+meta.label+' \u00b7 +'+pinnedSub.points+' pts</div></div>'+
      '</div></div>';
    }

    var skin = u.equippedSkin ? SKINS.filter(function(s){ return s.id===u.equippedSkin; })[0] : null;
    var outerStyle = skin ? ' style="background:'+skin.gradient+'"' : '';
    var animClass = u.equippedAnimation === "shimmer" ? " anim-shimmer" : u.equippedAnimation === "sparkle" ? " anim-sparkle" : "";
    var taglineHtml = (u.taglineUnlocked && u.tagline) ? '<div class="pc-tagline">\u201c'+escapeHtml(u.tagline)+'\u201d</div>' : "";

    return '<div class="player-card tier-'+slug+'"'+outerStyle+'><div class="player-card-inner'+animClass+'">'+
      '<div class="avatar-wrap">'+
        '<img src="'+(u.profileImage||placeholderAvatar())+'" alt="'+escapeHtml(u.name)+'">'+
        (editable ? '<label class="avatar-edit" title="Change profile picture">\uD83D\uDCF7<input type="file" accept="image/*" id="avatar-input" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label>' : '')+
      '</div>'+
      '<div class="pc-main">'+
        '<div class="pc-name">'+escapeHtml(u.name)+'</div>'+
        taglineHtml+
        '<div class="pc-rank">\u2726 '+rank+'</div>'+
        '<div class="pc-points">Points<br><b>'+totals.points+'</b></div>'+
        (nxt.next ? '<div class="pc-progress"><div class="pc-progress-fill" style="width:'+nxt.pct+'%"></div></div><div class="pc-progress-label">'+nxt.pointsToGo+' pts to '+nxt.next+'</div>' : '<div class="pc-progress-label">Max rank reached \uD83D\uDD25</div>')+
        '<div class="pc-badges">'+badges+'</div>'+
        featuredHtml+
        (editable ? '<div class="pc-share"><button class="btn btn-ghost btn-sm" data-action="share-card">Copy card to flex \u2197</button></div>' : '')+
      '</div>'+
    '</div></div>';
  }

  function renderSubmitForm(){
    var catOptions = CATEGORY_ORDER.map(function(cat){
      var meta = CATEGORY_META[cat];
      return '<div class="cat-option '+(submitForm.category===cat?'active':'')+'" data-action="pick-category" data-cat="'+cat+'">'+
        '<span class="icon">'+meta.icon+'</span>'+meta.label+'</div>';
    }).join("");

    var thumbs = submitForm.images.map(function(img, idx){
      return '<div class="thumb-item"><img src="'+img+'" alt=""><button class="thumb-remove" data-action="remove-sub-image" data-idx="'+idx+'">\u00d7</button></div>';
    }).join("");

    return '<div class="card">'+
      '<p class="section-title">Submit a new achievement</p>'+
      '<div class="form-grid">'+
        '<div class="field"><label>Category</label><div class="cat-select">'+catOptions+'</div></div>'+
        '<div class="field"><label for="sub-title">What did you achieve?</label><input id="sub-title" type="text" placeholder="e.g. Won the district chess final" maxlength="70" value="'+escapeHtml(submitForm.title)+'"></div>'+
        '<div class="field"><label for="sub-desc">Tell us more</label><textarea id="sub-desc" rows="3" placeholder="Add any details that help us verify it">'+escapeHtml(submitForm.description)+'</textarea></div>'+
        '<div class="field"><label>Proof images (optional — add as many as you like)</label>'+
          '<div class="upload-box">\uD83D\uDCCE Tap to add photos or screenshots<input type="file" accept="image/*" multiple id="sub-image"></div>'+
          (thumbs ? '<div class="thumb-grid">'+thumbs+'</div>' : '')+
        '</div>'+
      '</div>'+
      (submitError ? '<p class="form-error">'+escapeHtml(submitError)+'</p>' : '')+
      '<button class="btn btn-primary btn-block" style="margin-top:16px" data-action="submit-achievement">Send for review</button>'+
    '</div>';

  function renderHistory(u){
    var subs = (u.submissions||[]).slice().sort(function(a,b){ return new Date(b.date)-new Date(a.date); });
    if (!subs.length){
      return '<div class="empty-state"><div class="icon">\uD83D\uDCED</div><p>No submissions yet. Head to "Submit achievement" to log your first win.</p></div>';
    }
    return subs.map(function(s){ return renderSubmissionCard(s, u); }).join("");
  }

  function renderSubmissionCard(s, u){
    var meta = CATEGORY_META[s.category];
    var pillClass = s.status==="approved"?"pill-approved":s.status==="rejected"?"pill-rejected":"pill-pending";
    var pillLabel = s.status.charAt(0).toUpperCase()+s.status.slice(1);
    var imgs = subImages(s);
    var thumbHtml = imgs.length
      ? '<div class="sub-thumb-wrap" data-action="view-image" data-sub="'+s.id+'" data-user="'+u.id+'" style="cursor:zoom-in"><img class="sub-thumb" src="'+imgs[0]+'" alt="">'+(imgs.length>1 ? '<span class="sub-thumb-count">+'+(imgs.length-1)+'</span>' : '')+'</div>'
      : '<div class="sub-thumb placeholder">'+meta.icon+'</div>';
    var isPinned = u.pinnedId === s.id;
    var pinBtn = s.status === "approved"
      ? '<button class="btn '+(isPinned?'btn-primary':'btn-ghost')+' btn-sm" style="margin-top:10px" data-action="toggle-pin" data-sub="'+s.id+'">'+(isPinned ? "\u2605 Pinned — tap to unpin" : "\u2606 Pin as best achievement")+'</button>'
      : '';

    return '<div class="card">'+
      '<div class="sub-row">'+
        thumbHtml+
        '<div class="sub-info">'+
          '<div class="sub-title-row"><span class="sub-title">'+escapeHtml(s.title)+'</span><span class="pill '+pillClass+'">'+pillLabel+'</span></div>'+
          '<div class="sub-meta">'+meta.icon+' '+meta.label+' \u00b7 '+fmtDate(s.date)+(s.status==="approved" ? ' \u00b7 +'+s.points+' pts' : '')+'</div>'+
          (s.description ? '<div class="sub-desc">'+escapeHtml(s.description)+'</div>' : '')+
          (s.reviewNote ? '<div class="sub-note">Admin note: '+escapeHtml(s.reviewNote)+'</div>' : '')+
          (s.status === "rejected" ? '<div class="sub-note">'+rejectionExpiryLabel(s)+'</div>' : '')+
          pinBtn+
        '</div>'+
      '</div>'+
    '</div>';
  }

  function renderRoleBadges(totals){
    return CATEGORY_ORDER.map(function(cat){
      var meta = CATEGORY_META[cat];
      var tier = tierForCount(totals.counts[cat]);
      if (tier === 0) return "";
      return '<span class="lb-badge">'+meta.icon+' '+meta.role+' '+tier+'</span>';
    }).join("");
  }

  function rejectionExpiryLabel(s){
    var reviewed = new Date(s.reviewedDate || s.date).getTime();
    if (isNaN(reviewed)) return "";
    var msLeft = (reviewed + REJECTED_EXPIRY_MS) - Date.now();
    var daysLeft = Math.max(0, Math.ceil(msLeft / (24*60*60*1000)));
    return daysLeft > 0
      ? "This will auto-clear from your history in " + daysLeft + " day" + (daysLeft===1?"":"s") + "."
      : "This will clear from your history shortly.";
  }

  function renderLeaderboard(currentUserId){
    if (!appState.users.length){
      return '<div class="empty-state"><div class="icon">\uD83C\uDFC5</div><p>The leaderboard is empty. Get approved achievements to claim the top spot.</p></div>';
    }
    var searchBox = '<div class="field lb-search"><input id="lb-search" type="text" placeholder="Search players by name…" value="'+escapeHtml(leaderboardSearch)+'"></div>';

    var ranked = appState.users.slice().sort(function(a,b){ return userTotals(b).points - userTotals(a).points; });
    var rankIndex = {};
    ranked.forEach(function(u, i){ rankIndex[u.id] = i; });

    var query = leaderboardSearch.trim().toLowerCase();
    var visible = query ? ranked.filter(function(u){ return u.name.toLowerCase().indexOf(query) !== -1; }) : ranked;

    if (!visible.length){
      return searchBox+'<div class="empty-state"><div class="icon">\uD83D\uDD0D</div><p>No player matches "'+escapeHtml(leaderboardSearch)+'".</p></div>';
    }

    var rows = visible.map(function(u){
      var i = rankIndex[u.id];
      var totals = userTotals(u);
      var rankClass = i===0?"top1":i===1?"top2":i===2?"top3":"";
      var badges = renderRoleBadges(totals);
      return '<div class="lb-row '+(u.id===currentUserId?'me':'')+'">'+
        '<div class="lb-rank '+rankClass+'">'+(i+1)+'</div>'+
        '<img src="'+(u.profileImage||placeholderAvatar())+'" alt="">'+
        '<div><div class="lb-name">'+escapeHtml(u.name)+'</div><div class="lb-tag">'+rankForPoints(totals.points)+'</div>'+
        (badges ? '<div class="lb-badges">'+badges+'</div>' : '')+
        '</div>'+
        '<div class="lb-pts">'+totals.points+'</div>'+
      '</div>';
    }).join("");
    return searchBox+'<div>'+rows+'</div>';
  }

  // ---------------- Admin dashboard ----------------
  function renderAdmin(){
    var tabs = [
      {id:"queue", label:"Submissions"},
      {id:"users", label:"Manage players"}
    ];
    var tabsHtml = tabs.map(function(t){
      return '<button class="tab-btn '+(adminTab===t.id?'active':'')+'" data-action="admin-tab" data-tab="'+t.id+'">'+t.label+'</button>';
    }).join("");
    var body = adminTab === "queue" ? renderAdminQueue() : renderAdminUsers();
    return '<div class="wrap"><div class="tabs">'+tabsHtml+'</div>'+body+'</div>';
  }

  function allSubmissionsFlat(){
    var list = [];
    appState.users.forEach(function(u){
      (u.submissions||[]).forEach(function(s){
        list.push({ sub:s, user:u });
      });
    });
    return list.sort(function(a,b){ return new Date(b.sub.date)-new Date(a.sub.date); });
  }

  function renderAdminQueue(){
    var all = allSubmissionsFlat();
    var filtered = all.filter(function(x){ return adminFilter==="all" || x.sub.status===adminFilter; });
    var counts = { pending:0, approved:0, rejected:0 };
    all.forEach(function(x){ counts[x.sub.status]++; });

    var chips = [
      {id:"pending", label:"Pending ("+counts.pending+")"},
      {id:"approved", label:"Approved ("+counts.approved+")"},
      {id:"rejected", label:"Rejected ("+counts.rejected+")"},
      {id:"all", label:"All ("+all.length+")"}
    ].map(function(c){
      return '<button class="filter-chip '+(adminFilter===c.id?'active':'')+'" data-action="admin-filter" data-filter="'+c.id+'">'+c.label+'</button>';
    }).join("");

    var list = filtered.length ? filtered.map(function(x){ return renderAdminSubmissionCard(x.sub, x.user); }).join("") :
      '<div class="empty-state"><div class="icon">\u2705</div><p>Nothing here right now.</p></div>';

    return '<div class="filter-row">'+chips+'</div>'+list;
  }

    var pillClass = s.status==="approved"?"pill-approved":s.status==="rejected"?"pill-rejected":"pill-pending";

    return '<div class="card">'+
      '<div class="sub-row">'+
        thumbHtml+
        '<div class="sub-info">'+
          '<div class="sub-title-row"><span class="sub-title">'+escapeHtml(s.title)+'</span><span class="pill '+pillClass+'">'+pillLabel+'</span></div>'+
          '<div class="sub-meta">'+escapeHtml(u.name)+' \u00b7 '+meta.icon+' '+meta.label+' \u00b7 '+fmtDate(s.date)+'</div>'+
          (s.description ? '<div class="sub-desc">'+escapeHtml(s.description)+'</div>' : '')+

      '</div>'+

  function renderAdminUsers(){

      return '<div class="empty-state"><div class="icon">\uD83D\uDC65</div><p>No players on the roster yet.</p></div>';

  // ---------------- Modal ----------------
  function renderModalInto(){
    var el = document.createElement("div");
    if (modal.type === "gallery"){
      var imgs = subImages(findSubmission(modal.data.subId, modal.data.userId));
      if (!imgs.length){ modal = null; return; }
      var idx = Math.max(0, Math.min(modal.data.index || 0, imgs.length-1));
      modal.data.index = idx;
      el.className = "modal-overlay";
      el.setAttribute("data-action","close-modal");
      el.innerHTML = '<div class="modal-box" data-stop="1">'+
        '<img src="'+imgs[idx]+'" alt="proof">'+
        (imgs.length>1 ? '<div class="gallery-nav"><button data-action="gallery-prev">\u2039</button><span>'+(idx+1)+' / '+imgs.length+'</span><button data-action="gallery-next">\u203a</button></div>' : '')+
        '<button class="btn btn-ghost btn-block" style="margin-top:10px" data-action="close-modal">Close</button>'+
      '</div>';
    } else if (modal.type === "reject"){
      el.className = "modal-overlay";
      el.setAttribute("data-action","close-modal");
      el.innerHTML = '<div class="modal-box" data-stop="1">'+
        '<h3 style="margin-bottom:10px">Reject submission</h3>'+
        '<p class="sub" style="margin-bottom:14px">Optionally tell the player why.</p>'+
        '<textarea id="reject-note" placeholder="e.g. Photo doesn\'t show the certificate clearly"></textarea>'+
        '<div style="display:flex;gap:8px;margin-top:14px">'+
          '<button class="btn btn-ghost btn-block" data-action="close-modal">Cancel</button>'+
          '<button class="btn btn-danger btn-block" data-action="confirm-reject" data-sub="'+modal.data.subId+'" data-user="'+modal.data.userId+'">Confirm reject</button>'+
        '</div>'+
      '</div>';
    } else if (modal.type === "remove-user"){
      el.className = "modal-overlay";
      el.setAttribute("data-action","close-modal");
      el.innerHTML = '<div class="modal-box" data-stop="1">'+
        '<h3 style="margin-bottom:10px">Remove '+escapeHtml(modal.data.name)+'?</h3>'+
        '<p class="sub" style="margin-bottom:14px">This deletes their profile and every submission for good. This can\'t be undone.</p>'+
        '<div style="display:flex;gap:8px">'+
          '<button class="btn btn-ghost btn-block" data-action="close-modal">Cancel</button>'+
          '<button class="btn btn-danger btn-block" data-action="confirm-remove-user" data-id="'+modal.data.id+'">Remove player</button>'+
        '</div>'+
      '</div>';
    } else if (modal.type === "reset-password"){
      el.className = "modal-overlay";
      el.setAttribute("data-action","close-modal");
      el.innerHTML = '<div class="modal-box" data-stop="1">'+
        '<h3 style="margin-bottom:10px">Reset password for '+escapeHtml(modal.data.name)+'</h3>'+
        '<p class="sub" style="margin-bottom:14px">Set a new password for this player. They\'ll need it next time they sign in.</p>'+
        '<div class="form-grid">'+
          '<div class="field"><label for="rp-pass">New password</label><input id="rp-pass" type="password" placeholder="At least 4 characters"></div>'+
          '<div class="field"><label for="rp-pass2">Confirm new password</label><input id="rp-pass2" type="password" placeholder="Type it again"></div>'+
        '</div>'+
        (modal.data.error ? '<p class="form-error">'+escapeHtml(modal.data.error)+'</p>' : '')+
        '<div style="display:flex;gap:8px;margin-top:6px">'+
          '<button class="btn btn-ghost btn-block" data-action="close-modal">Cancel</button>'+
          '<button class="btn btn-primary btn-block" data-action="confirm-reset-password" data-id="'+modal.data.id+'">Set password</button>'+
        '</div>'+
      '</div>';
    } else if (modal.type === "share"){
      el.className = "modal-overlay";
      el.setAttribute("data-action","close-modal");
      el.innerHTML = '<div class="modal-box" data-stop="1">'+
        '<h3 style="margin-bottom:10px">Your flex card</h3>'+
        '<p class="sub" style="margin-bottom:10px">Copied to your clipboard — paste it wherever you want to flex.</p>'+
        '<textarea readonly style="min-height:140px">'+escapeHtml(modal.data.text)+'</textarea>'+
        '<button class="btn btn-primary btn-block" style="margin-top:14px" data-action="close-modal">Nice</button>'+
      '</div>';
    } else {
      return;
    }
    document.body.appendChild(el);
    attachHandlers(el);
    el.addEventListener("click", function(e){
      if (e.target.closest('[data-stop="1"]')) return;
      closeModal();
    });
  }
  function closeModal(){
    modal = null;
    document.querySelectorAll(".modal-overlay").forEach(function(el){ el.remove(); });
  }

  // ---------------- Event handling ----------------
  function attachHandlers(container){
    container.querySelectorAll("[data-action]").forEach(function(elm){
      elm.addEventListener("click", handleAction);
    });
    var avatarInput = container.querySelector("#avatar-input");
    if (avatarInput) avatarInput.addEventListener("change", handleAvatarChange);
    var subImageInput = container.querySelector("#sub-image");
    if (subImageInput) subImageInput.addEventListener("change", handleSubmitImageChange);
    var lbSearch = container.querySelector("#lb-search");
    if (lbSearch) lbSearch.addEventListener("input", handleLeaderboardSearchInput);
  }

  function handleLeaderboardSearchInput(e){
    leaderboardSearch = e.target.value;
    var caret = e.target.selectionStart;
    render();
    var el = document.getElementById("lb-search");
    if (el){
      el.focus();
      try{ el.setSelectionRange(caret, caret); }catch(err){}
    }
  }

  function handleAction(e){
    e.stopPropagation();
    var elm = e.currentTarget;
    var action = elm.getAttribute("data-action");

    if (action === "go-join"){ authError=""; authMode="signin"; screen="join"; try {   loadState(); } catch (e) {   console.log("Load failed, continuing..."); }  render(); }
    else if (action === "go-admin-login"){ adminLoginError=""; screen="admin-login"; render(); }
    else if (action === "go-landing"){ screen="landing"; render(); }
    else if (action === "logout"){ session={role:null,userId:null}; screen="landing"; render(); }

    else if (action === "auth-tab"){ authMode = elm.getAttribute("data-tab"); authError=""; render(); }
    else if (action === "signin-submit"){ handleSignIn(); }
    else if (action === "signup-submit"){ handleSignUp(); }
    else if (action === "admin-login-submit"){ handleAdminLoginSubmit(); }

    else if (action === "player-tab"){
      playerTab = elm.getAttribute("data-tab");
      submitError = "";
      if (playerTab === "leaderboard" || playerTab === "history" || playerTab === "card" || playerTab === "shop"){
        try {   loadState(); } catch (e) {   console.log("Load failed, continuing..."); }  render();
      } else render();
    }
    else if (action === "admin-tab"){ adminTab = elm.getAttribute("data-tab"); try {   loadState(); } catch (e) {   console.log("Load failed, continuing..."); }  render(); }
    else if (action === "admin-filter"){ adminFilter = elm.getAttribute("data-filter"); render(); }

    else if (action === "pick-category"){ submitForm.category = elm.getAttribute("data-cat"); render(); }
    else if (action === "remove-sub-image"){
      var idx = parseInt(elm.getAttribute("data-idx"), 10);
      submitForm.images.splice(idx, 1);
      render();
    }
    else if (action === "submit-achievement"){ handleSubmitAchievement(); }

    else if (action === "share-card"){ handleShareCard(); }
    else if (action === "toggle-pin"){ handleTogglePin(elm); }

    else if (action === "view-image"){
      modal = { type:"gallery", data:{ subId: elm.getAttribute("data-sub"), userId: elm.getAttribute("data-user"), index:0 } };
      render();
    }
    else if (action === "gallery-prev"){
      var imgs1 = subImages(findSubmission(modal.data.subId, modal.data.userId));
      modal.data.index = (modal.data.index - 1 + imgs1.length) % imgs1.length;
      render();
    }
    else if (action === "gallery-next"){
      var imgs2 = subImages(findSubmission(modal.data.subId, modal.data.userId));
      modal.data.index = (modal.data.index + 1) % imgs2.length;
      render();
    }
    else if (action === "close-modal"){ closeModal(); render(); }

    else if (action === "approve-sub"){ handleApprove(elm); }
    else if (action === "reject-sub"){
      modal = { type:"reject", data:{ subId: elm.getAttribute("data-sub"), userId: elm.getAttribute("data-user") } };
      render();
    }
    else if (action === "confirm-reject"){ handleConfirmReject(elm); }

    else if (action === "remove-user"){
      var targetUser = getUser(elm.getAttribute("data-id"));
      modal = { type:"remove-user", data:{ id: elm.getAttribute("data-id"), name: targetUser ? targetUser.name : "this player" } };
      render();
    }
    else if (action === "confirm-remove-user"){ handleConfirmRemoveUser(elm); }

    else if (action === "reset-password"){
      var rpUser = getUser(elm.getAttribute("data-id"));
      modal = { type:"reset-password", data:{ id: elm.getAttribute("data-id"), name: rpUser ? rpUser.name : "this player", error:"" } };
      render();
    }
    else if (action === "confirm-reset-password"){ handleConfirmResetPassword(elm); }
  }

  function handleSignUp(){
    var name = document.getElementById("au-name").value.trim();
    var pass = document.getElementById("au-pass").value;
    var pass2 = document.getElementById("au-pass2").value;
    if (!name){ authError = "Enter a name to continue."; render(); return; }
    if (name.length < 2){ authError = "Name's a bit too short."; render(); return; }
    if (pass.length < 4){ authError = "Password needs at least 4 characters."; render(); return; }
    if (pass !== pass2){ authError = "Passwords don't match."; render(); return; }
    var nameLower = name.toLowerCase();
    loadState().then(function(){
      if (findUserByNameLower(nameLower)){
        authError = "That name's already taken — try another.";
        render();
        return;
      }
      var id = genId();
      hashPassword(pass, id).then(function(hash){
        var user = {
          id: id, name: name, nameLower: nameLower, passwordHash: hash,
          profileImage: null, pinnedId: null, submissions: []
        };
        appState.users.push(user);
        return saveState().then(function(){
          session = { role:"player", userId:user.id };
          playerTab = "card";
          screen = "player";
          showToast("Welcome to the roster, "+name+"!");
          render();
        });
      });
    });
  }

  function handleSignIn(){
    var name = document.getElementById("au-name").value.trim();
    var pass = document.getElementById("au-pass").value;
    if (!name || !pass){ authError = "Enter your name and password."; render(); return; }
    var nameLower = name.toLowerCase();
    loadState().then(function(){
      var user = findUserByNameLower(nameLower);
      if (!user){ authError = "No player with that name yet — sign up instead?"; render(); return; }
      if (!user.passwordHash){ authError = "This player has no password set — ask the admin to reset one for you."; render(); return; }
      hashPassword(pass, user.id).then(function(hash){
        if (hash !== user.passwordHash){
          authError = "Wrong password.";
          render();
          return;
        }
        session = { role:"player", userId:user.id };
        playerTab = "card";
        screen = "player";
        render();
      });
    });
  }

  function handleAdminLoginSubmit(){
    var pass = document.getElementById("ad-pass").value;
    if (pass === ADMIN_PASSWORD){
      session = { role:"admin", userId:null };
      adminTab = "queue"; adminFilter = "pending";
      screen = "admin";
      try {   loadState(); } catch (e) {   console.log("Load failed, continuing..."); }  render();
    } else {
      adminLoginError = "Wrong password.";
      render();
    }
  }

  function handleAvatarChange(e){
    var file = e.target.files[0];
    if (!file) return;
    resizeImage(file, 300, 0.85).then(function(dataUrl){
      var u = getUser(session.userId);
      if (!u) return;
      u.profileImage = dataUrl;
      return saveState();
    }).then(function(){
      showToast("Profile picture updated.");
      render();
    }).catch(function(){ showToast("Couldn't read that image — try another."); });
  }

  function handleSubmitImageChange(e){
    var files = Array.prototype.slice.call(e.target.files || []);
    if (!files.length) return;
    Promise.all(files.map(function(f){ return resizeImage(f, 900, 0.75); })).then(function(dataUrls){
      submitForm.images = submitForm.images.concat(dataUrls);
      render();
    }).catch(function(){ showToast("Couldn't read one of those images — try again."); });
  }

  function handleSubmitAchievement(){
    var title = document.getElementById("sub-title").value.trim();
    var desc = document.getElementById("sub-desc").value.trim();
    if (!title){ submitError = "Give your achievement a title."; render(); return; }
    submitError = "";
    var sub = {
      id: genId(), category: submitForm.category, title: title, description: desc,
      images: submitForm.images.slice(), status: "pending", points: 0, date: new Date().toISOString(), reviewNote: ""
    };
    loadState().then(function(){
      var u = getUser(session.userId);
      if (!u){ showToast("Your profile couldn't be found — try logging in again."); return; }
      u.submissions = u.submissions || [];
      u.submissions.unshift(sub);
      return saveState().then(function(){
        submitForm = { category:"academic", title:"", description:"", images:[] };
        showToast("Sent for review!");
        playerTab = "history";
        render();
      });
    });
  }

  function handleShareCard(){
    var u = getUser(session.userId);
    var totals = userTotals(u);
    var rank = rankForPoints(totals.points);
    var lines = [
      "\u2726 MVNX PLAYER CARD \u2726",
      u.name+" — "+rank+" ("+totals.points+" pts)"
    ];
    CATEGORY_ORDER.forEach(function(cat){
      var meta = CATEGORY_META[cat];
      var tier = tierForCount(totals.counts[cat]);
      lines.push(meta.label+": "+(tier>0 ? meta.role+" "+tier : "Unranked"));
    });
    lines.push("Prove your own wins on MVNX \u2014 MVNeXpose.");
    var text = lines.join("\n");
    var done = function(){ modal = { type:"share", data:{ text:text } }; render(); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(done);
    } else done();
  }

  function handleTogglePin(elm){
    var subId = elm.getAttribute("data-sub");
    loadState().then(function(){
      var u = getUser(session.userId);
      if (!u) return;
      u.pinnedId = (u.pinnedId === subId) ? null : subId;
      return saveState();
    }).then(function(){ render(); });
  }

  function handleApprove(elm){
    var subId = elm.getAttribute("data-sub"), userId = elm.getAttribute("data-user");
    var input = document.querySelector('[data-role="points-input"][data-sub="'+subId+'"]');
    var pts = parseInt(input && input.value, 10);
    if (isNaN(pts) || pts < 0){ showToast("Enter a points value (0 or more) first."); return; }
    loadState().then(function(){
      var s = findSubmission(subId, userId);
      if (!s) return;
      s.status = "approved"; s.points = pts; s.reviewNote = ""; s.reviewedDate = new Date().toISOString();
      return saveState();
    }).then(function(){ showToast("Approved \u00b7 "+pts+" pts awarded."); render(); });
  }

  function handleConfirmReject(elm){
    var subId = elm.getAttribute("data-sub"), userId = elm.getAttribute("data-user");
    var noteField = document.getElementById("reject-note");
    var note = noteField ? noteField.value.trim() : "";
    loadState().then(function(){
      var s = findSubmission(subId, userId);
      if (!s) return;
      s.status = "rejected"; s.points = 0; s.reviewNote = note; s.reviewedDate = new Date().toISOString();
      return saveState();
    }).then(function(){
      modal = null;
      showToast("Submission rejected.");
      render();
    });
  }

  function handleConfirmRemoveUser(elm){
    var id = elm.getAttribute("data-id");
    loadState().then(function(){
      appState.users = appState.users.filter(function(u){ return u.id !== id; });
      return saveState();
    }).then(function(){
      modal = null;
      showToast("Player removed.");
      render();
    });
  }

  function handleConfirmResetPassword(elm){
    var id = elm.getAttribute("data-id");
    var pass = document.getElementById("rp-pass").value;
    var pass2 = document.getElementById("rp-pass2").value;
    if (pass.length < 4){ modal.data.error = "Password needs at least 4 characters."; render(); return; }
    if (pass !== pass2){ modal.data.error = "Passwords don't match."; render(); return; }
    loadState().then(function(){
      var u = getUser(id);
      if (!u){ modal = null; render(); return; }
      hashPassword(pass, u.id).then(function(hash){
        u.passwordHash = hash;
        return saveState();
      }).then(function(){
        modal = null;
        showToast("Password reset for "+u.name+".");
        render();
      });
    });
  }

  // ---------------- Init ----------------
  render();
 try {
  loadState();
} catch (e) {
  console.log(e);
}
render();

})();

</script>
</body>
</html>
